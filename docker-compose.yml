services:
  redink:
    build: .
    image: ktizo-redink:latest
    env_file:
      - ../ktizo_io/config/ai.env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:?Run via ktizo_io/scripts/ai-config.py --exec}
    container_name: redink
    ports:
      - "12398:12398"
    volumes:
      # 持久化数据目录
      - ./history:/app/history
      - ./output:/app/output
    restart: unless-stopped
